name = "meet-us"
compatibility_date = "2025-08-04"
compatibility_flags = ["nodejs_compat"]
main = "dist/_worker.js"

assets = { directory = "./public" }

[observability]
enabled = true

# Secrets (set via: wrangler secret put <KEY>):
# - BETTER_AUTH_SECRET: Secret for better-auth sessions
# - API_KEY: API key for scripting/automation access to /api/v1/* endpoints

[vars]
BETTER_AUTH_URL = "https://meet-us.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "meet-us-db"
database_id = "6cc958c9-b355-475c-8500-ab7152699525"
migrations_dir = "drizzle/migrations"
